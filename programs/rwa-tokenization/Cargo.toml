[package]
name = "rwa-tokenization"
version = "0.1.0"
description = "Tokenized Real World Assets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_tokenization"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
pyth-solana-receiver-sdk = "0.3.1"
pythnet-sdk = "=2.1.0"
solana-program = "< 2.0"
blake3 = "=1.5.5"
hashbrown = "=0.14.5"
block-buffer = "=0.10.4"
digest = "=0.10.7"
zeroize = "=1.3.0"
zeroize_derive = "=1.3.3"
proc-macro-crate = "=3.1.0"
indexmap = "=2.5.0"





